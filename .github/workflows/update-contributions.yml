name: GitHub-Profile-3D-Contrib

# Generates the isometric GitHub contribution graph and commits it back
# to this repository so the profile README stays up to date.
on:
  schedule:
    # 18:00 UTC (~midnight IST), once per day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Clean up contribution graph
        run: python .github/scripts/cleanup_graph.py profile-3d-contrib/profile-night-rainbow.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "generated: refresh contribution graph"; then
            git push
          fi
